[package]
name = "simonsays-tray"
version = "1.0.0"
edition = "2021"
description = "SimonSays in the tray: starts the app on the Node it was built with, and opens, restarts and stops it."
license = "Apache-2.0"
publish = false

[[bin]]
name = "SimonSays"
path = "src/main.rs"

[dependencies]
tray-icon = "0.26"
tao = "0.37"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
